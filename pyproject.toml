[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevbrief"
version = "0.1.0"
description = "Clean, traceable state briefings for TypeSafe's Jev model."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Parth Komalwad" }]
keywords = ["jev", "typesafe", "ai-agents", "llm", "playwright"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["playwright>=1.40", "typesafe-sdk>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jevbrief = "jevbrief.cli:main"

[project.urls]
Homepage = "https://github.com/parthkomalwad/jevbrief"
Issues = "https://github.com/parthkomalwad/jevbrief/issues"

[tool.hatch.build.targets.sdist]
include = ["jevbrief", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["jevbrief"]
