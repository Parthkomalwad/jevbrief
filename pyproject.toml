[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jevbrief"
version = "0.3.0"
description = "Clean, traceable state briefings for TypeSafe's Jev model, from any source: web pages, JSON, and more."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Parth Komalwad" }]
keywords = ["jev", "typesafe", "ai-agents", "llm", "playwright"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = ["typesafe-sdk>=0.7"]

[project.optional-dependencies]
web = ["playwright>=1.40"]
json = ["tomli>=2; python_version < '3.11'"]
otel = ["tomli>=2; python_version < '3.11'"]
nes = ["cynes>=0.1.2"]
ci = []
mcp = []
all = ["jevbrief[web,json,otel,nes,ci,mcp]"]
dev = ["jevbrief[all]", "pytest>=8"]

[project.entry-points."jevbrief.adapters"]
web = "jevbrief.adapters.web:WebAdapter"
json = "jevbrief.adapters.json:JsonAdapter"
otel = "jevbrief.adapters.otel:OtelAdapter"
nes = "jevbrief.adapters.nes:NesAdapter"
ci = "jevbrief.adapters.ci:CiAdapter"
mcp = "jevbrief.adapters.mcp:McpAdapter"

[project.scripts]
jevbrief = "jevbrief.cli:main"

[project.urls]
Homepage = "https://github.com/parthkomalwad/jevbrief"
Issues = "https://github.com/parthkomalwad/jevbrief/issues"

[tool.hatch.build.targets.sdist]
include = ["jevbrief", "tests", "README.md", "LICENSE", "pyproject.toml"]
# Recorded NES snapshots contain game level data (CC BY-NC-SA 4.0); they stay in the repo, not the package.
exclude = ["tests/fixtures/nes", "tests/test_nes.py"]

[tool.hatch.build.targets.wheel]
packages = ["jevbrief"]

[tool.pytest.ini_options]
testpaths = ["tests"]
