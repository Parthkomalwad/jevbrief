<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jevbrief trace viewer</title>
<style>
:root {
  --bg: #ffffff; --panel: #dedede; --text: #111111; --muted: #555555; --line: #111111; --soft-line: #bdbdbd;
  --bar-bg: #1b1b1b; --bar-text: #f2f2f2;
  --accent: #ff3fd2; --accent-soft: #ffe0f7; --sky: #d7ecff;
  --good: #0f7a3d; --good-soft: #d6f2e0; --warn: #9a6200; --warn-soft: #fbeccc;
  --bad: #c0262d; --bad-soft: #fbdcdc; --bar: #b9b9b9;
  --mono: "Cascadia Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0e10; --panel: #1c1c1f; --text: #ececec; --muted: #9a9aa0; --line: #3a3a40; --soft-line: #2c2c31;
    --bar-bg: #000000; --bar-text: #f2f2f2;
    --accent: #ff5fdc; --accent-soft: #3a1633; --sky: #13233a;
    --good: #5fd18e; --good-soft: #10301d; --warn: #f0b64a; --warn-soft: #33280d;
    --bad: #ff7a73; --bad-soft: #3a1717; --bar: #3a3a42;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--mono); }
header.top { position: relative; display: flex; align-items: center; gap: 12px; padding: 14px 20px; overflow: hidden;
  background:
    radial-gradient(ellipse 40% 140% at 0% 0%, var(--accent) 0%, transparent 70%),
    radial-gradient(ellipse 35% 140% at 100% 0%, var(--accent) 0%, transparent 70%),
    linear-gradient(var(--sky), var(--sky));
  border-bottom: 2px solid var(--line); }
header.top::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.2px); background-size: 4px 4px; }
header.top > * { position: relative; z-index: 1; }
header.top h1 { font: 600 15px var(--sans); margin: 0; background: #fff; color: #111; padding: 4px 8px; }
header.top h1 span { color: #111; }
header.top .meta { background: var(--bar-bg); color: var(--bar-text); font-size: 12px; padding: 4px 8px; }
header.top input { margin-left: auto; width: 260px; max-width: 40vw; padding: 6px 10px; border: 2px solid #111; border-radius: 0;
  background: #fff; color: #111; font: 13px var(--mono); }
.app { display: grid; grid-template-columns: 330px 1fr; height: calc(100% - 58px); }
.list { border-right: 2px solid var(--line); overflow-y: auto; background: var(--bg); }
.item { display: grid; grid-template-columns: 8px 1fr auto; gap: 10px; padding: 10px 14px 10px 0; border-bottom: 1px solid var(--soft-line); cursor: pointer; }
.item:hover { background: var(--panel); }
.item.sel { background: var(--bar-bg); color: var(--bar-text); }
.item.sel .sub { color: #bdbdbd; }
.item > div { min-width: 0; }
.item .goal { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .conf { font-size: 13px; align-self: center; font-weight: 600; }
.detail { overflow-y: auto; padding: 24px 28px 60px;
  background: linear-gradient(180deg, var(--sky) 0, var(--bg) 220px); }
.card { background: var(--panel); border: 2px solid var(--line); outline: 1px solid var(--line); outline-offset: 2px;
  padding: 0 18px 16px; margin: 0 3px 22px; }
.card > h2, .card > .bar { margin: 0 -18px 14px; padding: 5px 10px; background: var(--bar-bg); color: var(--bar-text);
  font: 13px var(--mono); letter-spacing: .3px; }
.card.stats { padding-top: 16px; }
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.hero .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.hero .choice { font: 600 24px var(--sans); }
.hero .ring { width: 70px; height: 70px; display: grid; place-items: center; font: 700 17px var(--mono); flex: none; border: 2px solid currentColor; }
.badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.badge { font-size: 12px; padding: 1px 8px; background: var(--bg); border: 1px solid var(--line); color: var(--text); }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: currentColor; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: currentColor; }
.badge.good { background: var(--good-soft); color: var(--good); border-color: currentColor; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat .n { font: 700 22px var(--mono); }
.stat .k { color: var(--muted); font-size: 12px; }
.prob { display: grid; grid-template-columns: minmax(120px, 280px) 1fr 60px; gap: 10px; align-items: center; margin: 6px 0; }
.prob .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prob .track { height: 12px; background: var(--bg); border: 1px solid var(--line); }
.prob .fill { height: 100%; background: var(--bar); }
.prob.top .fill { background: var(--accent); }
.prob .p { font-size: 12px; text-align: right; color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--soft-line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px; }
td.id, td.num { font-size: 12px; white-space: nowrap; }
tr.chosen td { background: var(--accent-soft); }
tr.chosen td:first-child { box-shadow: inset 4px 0 var(--accent); }
.kind { font-size: 11px; padding: 0 6px; background: var(--bg); border: 1px solid var(--line); }
.rule { font-size: 12px; color: var(--good); }
details.group { border-top: 1px solid var(--soft-line); }
details.group:first-of-type { border-top: 0; }
details.group summary { cursor: pointer; padding: 8px 0; display: flex; gap: 10px; align-items: center; list-style: none; }
details.group summary::-webkit-details-marker { display: none; }
details.group summary::before { content: "[+]"; color: var(--muted); }
details.group[open] summary::before { content: "[-]"; }
.code { font-weight: 700; }
.count { font-size: 12px; background: var(--bar-bg); color: var(--bar-text); padding: 0 7px; }
.why { color: var(--muted); font-size: 12px; }
.dropped td { color: var(--muted); }
.dropped td.lbl { text-decoration: line-through; text-decoration-color: var(--soft-line); }
.empty { color: var(--muted); padding: 40px; text-align: center; }
.err { font-size: 12px; color: var(--bad); white-space: pre-wrap; }
.top-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 0 22px; align-items: start; }
.shot { position: relative; border: 1px solid var(--line); background: #fff; line-height: 0; }
.shot img { width: 100%; height: auto; display: block; }
.bx { position: absolute; transition: opacity .15s; }
.bx.kept { outline: 2px solid rgba(40, 120, 255, .75); background: rgba(40, 120, 255, .06); }
.bx.dropped { outline: 1px dashed rgba(120, 120, 120, .9); background: rgba(0, 0, 0, .28); }
.bx.chosen { outline: 3px solid var(--accent); background: rgba(255, 63, 210, .14); z-index: 3; }
.bx.chosen::after { content: "Jev's pick"; position: absolute; left: -3px; top: -22px; line-height: 1.4; white-space: nowrap;
  background: var(--accent); color: #fff; font: 700 11px var(--mono); padding: 2px 6px; }
.bx.hl { outline: 3px solid #111 !important; background: rgba(255, 230, 0, .35) !important; z-index: 4; opacity: 1 !important; }
.shot.hide-kept .bx.kept, .shot.hide-dropped .bx.dropped { opacity: 0; pointer-events: none; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); padding-top: 10px; }
.legend label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
.sw { width: 14px; height: 10px; display: inline-block; }
.sw.chosen { outline: 3px solid var(--accent); } .sw.kept { outline: 2px solid rgba(40, 120, 255, .75); } .sw.dropped { outline: 1px dashed #888; background: rgba(0,0,0,.28); }
tr.hl td { background: rgba(255, 230, 0, .35) !important; }
.help { margin: 0 3px 22px; border: 2px dashed var(--line); background: var(--bg); padding: 10px 14px; }
.help summary { cursor: pointer; font-weight: 700; }
.help ol { margin: 8px 0 2px; padding-left: 20px; } .help li { margin: 4px 0; }
.help code, .noshot code { background: var(--panel); padding: 0 4px; }
.noshot { color: var(--muted); font-size: 12px; padding: 18px 0; line-height: 1.5; }
.top-grid.one { grid-template-columns: 1fr; }
.top-grid .prob { grid-template-columns: minmax(0, 1fr) minmax(60px, 40%) 52px; }

/* Replay: an animated walk through one decision */
.story .steps { list-style: none; margin: 0 0 12px; padding: 0; counter-reset: st; }
.story .steps li { counter-increment: st; display: flex; gap: 10px; align-items: baseline; padding: 4px 0;
  opacity: .18; transform: translateY(4px); transition: opacity .45s, transform .45s; }
.story .steps li::before { content: counter(st); flex: none; width: 20px; height: 20px; display: grid; place-items: center;
  background: var(--bar-bg); color: var(--bar-text); font-size: 11px; }
.story .steps li.on { opacity: 1; transform: none; }
.story .steps li.on:last-child::before { background: var(--accent); }
.story .steps b { font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 220px; overflow: hidden; padding: 2px; }
.chip { font-size: 11px; padding: 1px 6px; border: 1px solid var(--line); background: var(--bg); white-space: nowrap;
  max-width: 190px; overflow: hidden; text-overflow: ellipsis; opacity: 0; transform: scale(.85);
  transition: opacity .35s, transform .35s, background .35s, border-color .35s, color .35s; }
.story.s1 .chip { opacity: 1; transform: none; }
.story.s2 .chip.dropped { opacity: .22; text-decoration: line-through; transform: translateY(3px) scale(.95); }
.story.s3 .chip.kept { border-color: rgba(40, 120, 255, .9); box-shadow: inset 0 0 0 1px rgba(40, 120, 255, .9); }
.story.s4 .chip.pick { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.06); transform-origin: left center; z-index: 2; }
.buckets { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; min-height: 22px; }
.bucket { font-size: 11px; padding: 1px 7px; background: var(--bad-soft); color: var(--bad); border: 1px solid currentColor;
  opacity: 0; transform: translateY(-6px); transition: opacity .4s, transform .4s; }
.story.s2 .bucket { opacity: 1; transform: none; }
.meaning { margin-top: 12px; padding: 10px 12px; border-left: 4px solid var(--accent); background: var(--bg);
  opacity: 0; transition: opacity .6s; line-height: 1.5; }
.story.s4 .meaning { opacity: 1; }
.story .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.story button { font: 12px var(--mono); padding: 3px 10px; border: 2px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
.story button:hover { background: var(--accent-soft); }
.prob .fill { transition: width .9s cubic-bezier(.2, .8, .2, 1); }
.bx { transition: opacity .4s, outline-color .4s; }
@media (prefers-reduced-motion: reduce) {
  .story .steps li, .chip, .bucket, .meaning, .prob .fill, .bx { transition: none !important; }
}

/* Timeline renderer: one bar per fact across the source's time window */
.tl .axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin: 0 0 4px 38%; }
.tl .rows { position: relative; }
.tl .row { display: grid; grid-template-columns: 38% 1fr; gap: 8px; align-items: center; padding: 3px 0; font-size: 12px;
  transition: opacity .4s; }
.tl .row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tl .row .lane { position: relative; height: 14px; background: var(--bg); border: 1px solid var(--soft-line); }
.tl .span { position: absolute; top: 1px; bottom: 1px; min-width: 3px; background: var(--bar); transform-origin: left;
  transform: scaleX(0); transition: transform .8s cubic-bezier(.2, .8, .2, 1), background .4s; }
.tl .count { position: absolute; right: 4px; top: -1px; font-size: 10px; color: var(--muted); }
.tl .marker { position: absolute; top: -18px; bottom: 0; width: 0; border-left: 2px dashed var(--bad); pointer-events: none; }
.tl .marker span { position: absolute; top: 0; left: 4px; font-size: 10px; color: var(--bad); white-space: nowrap; }
.tl.s1 .span { transform: scaleX(1); }
.tl.s2 .row.dropped { opacity: .3; }
.tl.s3 .row.kept .span { background: rgba(40, 120, 255, .8); }
.tl.s4 .row.pick .span { background: var(--accent); }
.tl.s4 .row.pick .name { color: var(--accent); font-weight: 700; }
.tl.hide-dropped .row.dropped { display: none; }
@media (prefers-reduced-motion: reduce) { .tl .span, .tl .row { transition: none !important; } }
@media (max-width: 1100px) { .top-grid { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .list { max-height: 40vh; border-right: 0; border-bottom: 2px solid var(--line); }
  .detail { padding: 16px; }
  .prob { grid-template-columns: 1fr 1fr 48px; }
  header.top { flex-wrap: wrap; }
  header.top input { width: 100%; max-width: none; margin-left: 0; }
}
</style>
</head>
<body>
<header class="top">
  <h1><span>jev</span>brief trace viewer</h1>
  <div class="meta" id="meta"></div>
  <input id="q" type="search" placeholder="Filter by goal, URL, or outcome">
</header>
<div class="app">
  <nav class="list" id="list" aria-label="Decisions"></nav>
  <main class="detail" id="detail"></main>
</div>
<script id="traces" type="application/json">/*__TRACES__*/[]</script>
<script>
const WHY = {
  hidden: "Not observable right now",
  disabled: "Exists but cannot be acted on",
  not_interactive: "Plain text with no link to the goal",
  "web.not_interactive": "Plain text (a heading) with no link to the goal",
  unlabeled: "No usable label, so Jev could not tell what it is",
  duplicate: "Same kind and label as a higher-scored element",
  low_score: "Scored below the keep threshold",
  budget: "Would have been kept, cut only to fit the token or option budget",
};
const KEPT_WHY = {
  goal_match: "matches the goal",
  near_goal_input: "next to a goal field",
  in_viewport: "visible on screen",
  "web.near_goal_input": "next to a goal field",
  "web.in_viewport": "visible on screen",
  base: "no drop rule applied",
  pinned: "pinned by you",
  raw: "raw arm, no filtering",
};
let showDropped = false, helpSeen = false;
try { helpSeen = localStorage.getItem("jevbrief-help-seen") === "1"; } catch {}
const ORDER = ["budget", "low_score", "duplicate", "not_interactive", "web.not_interactive", "unlabeled", "disabled", "hidden"];
const whyOf = (r, code) => r.reasons?.[code] || WHY[code] || "";
const keptWhy = (r, code) => (r.reasons?.[code] || "").replace(/^Kept: /, "") || KEPT_WHY[code] || code;
const imageOf = (r) => r.image?.src ? { image: r.image.src, width: r.image.width, height: r.image.height } : r.page;
const records = JSON.parse(document.getElementById("traces").textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let selected = 0, visible = records.map((_, i) => i);

function tone(r) {
  const c = r.jev?.confidence;
  if (r.outcome === "error" || c == null || c < 0.5) return "bad";
  return c >= 0.8 ? "good" : "warn";
}
const color = (t) => `var(--${t})`;
const soft = (t) => `var(--${t}-soft)`;
const fmt = (c) => (c == null ? "–" : c.toFixed(2));
const page = (url) => { try { const u = new URL(url); return u.protocol === "file:" ? u.pathname.split("/").pop() : u.host + u.pathname; } catch { return url || ""; } };
const where = (r) => r.source?.url ? page(r.source.url) : (r.source?.name || r.adapter?.name || "");
const labelOf = (r, id) => id === "none" ? "None of these" : (r.facts.find((f) => f.id === id)?.label || id);

function renderList() {
  $("list").innerHTML = visible.length ? visible.map((i) => {
    const r = records[i], t = tone(r);
    return `<div class="item ${i === selected ? "sel" : ""}" data-i="${i}" tabindex="0">
      <div class="strip" style="background:${color(t)}"></div>
      <div><div class="goal">${esc(r.goal)}</div>
      <div class="sub">tick ${r.tick} · ${esc(r.outcome)} · ${esc(where(r))}</div></div>
      <div class="conf" style="color:${color(t)}">${fmt(r.jev?.confidence)}</div></div>`;
  }).join("") : `<div class="empty">No decisions match.</div>`;
}

function renderDetail() {
  const r = records[selected];
  if (!r) { $("detail").innerHTML = `<div class="empty">No trace records found in this file.</div>`; return; }
  const t = tone(r), j = r.jev || {};
  const kept = r.facts.filter((f) => f.kept);
  const dropped = r.facts.filter((f) => !f.kept);
  const cut = r.budget?.cut_for_budget || 0;
  const badges = [
    `<span class="badge">${esc(r.outcome)}</span>`,
    cut ? `<span class="badge warn">${cut} cut for budget</span>` : "",
    j.confidence != null && j.confidence < 0.5 ? `<span class="badge bad">Low confidence</span>` : "",
    r.outcome === "reused" ? `<span class="badge good">Reused tick ${r.fingerprint?.reused_tick} (state unchanged)</span>` : "",
    `<span class="badge">${esc(j.model)}</span>`,
  ].join("");

  const probs = Object.entries(j.probabilities || {}).sort((a, b) => b[1] - a[1]);
  const shown = probs.slice(0, 8), rest = probs.slice(8).reduce((s, [, p]) => s + p, 0);
  const probHtml = shown.length ? shown.map(([id, p], k) => `
    <div class="prob ${k === 0 ? "top" : ""}"><div class="name" title="${esc(labelOf(r, id))}">${esc(labelOf(r, id))}</div>
    <div class="track"><div class="fill" data-w="${(p * 100).toFixed(1)}%" style="width:0"></div></div><div class="p">${(p * 100).toFixed(1)}%</div></div>`).join("")
    + (probs.length > 8 ? `<div class="why">${probs.length - 8} more options share ${(rest * 100).toFixed(1)}%</div>` : "")
    : `<div class="why">No probabilities recorded${r.outcome === "reused" ? " (answer reused from an earlier tick)" : ""}.</div>`;

  const keptRows = kept.sort((a, b) => (b.score ?? 0) - (a.score ?? 0)).map((f) => `
    <tr data-id="${esc(f.id)}" class="${f.id === j.choice ? "chosen" : ""}"><td class="id">${esc(f.id)}</td><td><span class="kind">${esc(f.kind ?? "")}</span></td>
    <td>${esc(f.label ?? "")}</td><td class="num">${f.score != null ? f.score.toFixed(2) : ""}</td><td class="rule" title="${esc(f.reason)}">${esc(keptWhy(r, f.reason))}</td></tr>`).join("");

  const groups = {};
  dropped.forEach((f) => (groups[f.reason] ||= []).push(f));
  const codes = Object.keys(groups).sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99));
  const droppedHtml = codes.length ? codes.map((code) => `
    <details class="group" ${code === "budget" ? "open" : ""}><summary><span class="code">${esc(code)}</span>
    <span class="count">${groups[code].length}</span><span class="why">${esc(whyOf(r, code))}</span></summary>
    <table class="dropped"><tbody>${groups[code].map((f) => `<tr data-id="${esc(f.id)}"><td class="id">${esc(f.id)}</td>
    <td><span class="kind">${esc(f.kind ?? "")}</span></td><td class="lbl">${esc(f.label || "(no label)")}</td></tr>`).join("")}</tbody></table></details>`).join("")
    : `<div class="why">Nothing was dropped.</div>`;

  const pg = imageOf(r);
  const boxes = pg ? r.facts.filter((f) => Array.isArray(f.box) && f.box[2] > 0 && f.box[3] > 0 &&
      f.box[1] < pg.height && f.box[1] + f.box[3] > 0 && f.box[0] < pg.width && f.box[0] + f.box[2] > 0)
    .map((f) => {
      const [x, y, w, h] = f.box, cls = f.id === j.choice ? "chosen" : f.kept ? "kept" : "dropped";
      const tip = `${f.label || "(no label)"} · ${f.kept ? "sent to Jev" : "dropped: " + f.reason}`;
      return `<div class="bx ${cls}" data-id="${esc(f.id)}" title="${esc(tip)}" style="left:${x / pg.width * 100}%;top:${y / pg.height * 100}%;width:${w / pg.width * 100}%;height:${h / pg.height * 100}%"></div>`;
    }).join("") : "";
  const shotHtml = pg ? `<div class="shot ${showDropped ? "" : "hide-dropped"}" id="shot"><img src="${pg.image}" alt="Snapshot of the source Jev was asked about">${boxes}</div>
    <div class="legend"><span><i class="sw chosen"></i> Jev's pick</span>
      <label><input type="checkbox" id="t-kept" checked> <i class="sw kept"></i> sent to Jev</label>
      <label><input type="checkbox" id="t-dropped" ${showDropped ? "checked" : ""}> <i class="sw dropped"></i> dropped</label>
      <span>Hover a box or a table row to match them.</span></div>`
    : "";


  const reasonCounts = Object.entries(groups).map(([c, fs]) => [c, fs.length]).sort((a, b) => b[1] - a[1]);
  const pick = r.facts.find((f) => f.id === j.choice);
  const second = probs[1] && probs[1][1] >= 0.01 ? `${labelOf(r, probs[1][0])} (${(probs[1][1] * 100).toFixed(0)}%)` : "";
  const shownFacts = r.facts.slice(0, 160);
  const chips = shownFacts.map((f, i) => `<span class="chip ${f.id === j.choice ? "pick kept" : f.kept ? "kept" : "dropped"}" data-id="${esc(f.id)}"
      title="${esc((f.label || "(no label)") + " · " + (f.kept ? "sent to Jev" : "dropped: " + f.reason))}" style="transition-delay:${Math.min(i * 6, 900)}ms">${esc(f.label || "(no label)")}</span>`).join("")
    + (r.facts.length > shownFacts.length ? `<span class="chip kept" style="opacity:1">+${r.facts.length - shownFacts.length} more</span>` : "");
  const buckets = reasonCounts.map(([c, n]) => `<span class="bucket" title="${esc(whyOf(r, c))}">${esc(c)} &times;${n}</span>`).join("");
  const sure = j.confidence == null ? "" : j.confidence >= 0.8 ? "very sure" : j.confidence >= 0.5 ? "fairly sure" : "not sure";
  const top = reasonCounts.slice(0, 2).map(([c, n]) => `${n} ${whyOf(r, c).replace(/^Kept: /, "").toLowerCase() || c}`).join(", and ");
  const answerLine = r.outcome === "error" ? `The call to Jev <b>failed</b>, so the agent took no action.`
    : r.outcome === "reused" ? `The facts had not changed since decision ${r.fingerprint?.reused_tick}, so Jev's earlier answer <b>${esc(labelOf(r, j.choice))}</b> was reused with no new call.`
    : `Jev answered <b>${esc(labelOf(r, j.choice))}</b> with confidence <b>${fmt(j.confidence)}</b>${second ? `. Next best: ${esc(second)}` : ""}.`;
  const meaning = r.outcome === "error" ? "Nothing was decided. Check the error above, then run it again."
    : r.outcome === "low_confidence" || !pick && j.choice === "none"
      ? `Jev was ${sure || "unsure"} and did not find a clear answer for "${esc(r.goal)}", so the agent should not act. Check "What Jev was not told" in case the right fact was dropped.`
      : `For "${esc(r.goal)}", Jev is ${sure} the answer is <b>${esc(labelOf(r, j.choice))}</b>. jevbrief sent ${kept.length} of ${r.facts.length} facts${top ? `; the rest were left out mainly because of ${esc(top)}` : ""}.`;

  const isTimeline = r.adapter?.renderer === "timeline" && r.facts.some((f) => f.view);
  const hhmm = (iso) => (iso || "").slice(11, 16);
  const tlRows = isTimeline ? [...r.facts].filter((f) => f.view)
    .sort((a, b) => (b.kept - a.kept) || (a.view.start - b.view.start)).map((f) => {
      const cls = f.id === j.choice ? "pick kept" : f.kept ? "kept" : "dropped";
      const left = f.view.start * 100, width = Math.max((f.view.end - f.view.start) * 100, 0.6);
      return `<div class="row ${cls}" data-id="${esc(f.id)}" title="${esc((f.label || "") + " · " + (f.kept ? "sent to Jev" : "dropped: " + f.reason))}">
        <div class="name">${esc(f.label || "(no label)")}</div>
        <div class="lane"><div class="span" style="left:${left}%;width:${width}%"></div><span class="count">${f.view.count ?? ""}</span></div></div>`;
    }).join("") : "";
  const marker = isTimeline && r.source?.marker != null
    ? `<div class="marker" style="left:calc(38% + 8px + (100% - 38% - 8px) * ${r.source.marker})"><span>incident start ${esc(hhmm(r.source.incident_start))}</span></div>` : "";
  const timelineHtml = isTimeline ? `<div class="card tl ${showDropped ? "" : "hide-dropped"}" id="tl"><div class="bar">Timeline &#9642; ${esc(where(r))}${r.source?.records ? ` &#9642; ${r.source.records} records` : ""}</div>
    <div class="axis"><span>${esc(hhmm(r.source?.window?.[0]))}</span><span>${esc(hhmm(r.source?.window?.[1]))} UTC</span></div>
    <div class="rows">${marker}${tlRows}</div>
    <div class="legend"><span><i class="sw chosen"></i> Jev's pick</span><span><i class="sw kept"></i> sent to Jev</span>
      <label><input type="checkbox" id="tl-dropped" ${showDropped ? "checked" : ""}> <i class="sw dropped"></i> dropped</label>
      <span>Each bar spans the first to the last record of a group. The number is how many records it has.</span></div></div>` : "";
  const storyHtml = `<div class="card story" id="story"><div class="bar">Replay &#9642; what happened in this decision</div>
    <div class="controls"><button id="replay" type="button">&#9654; Replay</button><button id="skip" type="button">Skip to the end</button></div>
    <ol class="steps">
      <li><span>jevbrief read <b>${r.source?.raw_facts ?? r.facts.length} facts</b> from ${esc(where(r)) || "the source"}.</span></li>
      <li><span>It dropped <b>${dropped.length}</b>, each with a reason${cut ? `, including ${cut} cut only for the token budget` : ""}.</span></li>
      <li><span>It sent <b>${kept.length}</b> to Jev${r.budget?.used_tokens ? `, about ${r.budget.used_tokens} tokens` : ""}, asking: "${esc(j.question || "")}" for the goal "${esc(r.goal)}".</span></li>
      <li><span>${answerLine}</span></li>
    </ol>
    <div class="chips">${chips}</div>
    <div class="buckets">${buckets}</div>
    <div class="meaning"><b>What this means:</b> ${meaning}</div></div>`;
  $("detail").innerHTML = `
    <details class="help" ${helpSeen ? "" : "open"} id="help"><summary>How to read this page</summary><ol>
      <li><b>Replay:</b> an animated walk through the decision: every fact read, what was dropped and why, what was sent to Jev, and Jev's answer. Press Replay to watch it again.</li>
      <li><b>Left list:</b> one row per decision. The colored strip is Jev's confidence: green 0.8 and up, amber 0.5 to 0.8, red below 0.5 or an error.</li>
      <li><b>Jev picked:</b> the element Jev chose for the goal, and how sure it was. Below 0.5 your agent takes no action.</li>
      <li><b>Timeline</b> (log sources): one bar per log group from its first to its last record, with the incident start marked.</li>
      <li><b>What Jev saw</b> (sources with an image, such as web pages): the source when the decision was made. Pink is Jev's pick, blue boxes were sent to Jev, and dark dashed boxes were dropped.</li>
      <li><b>What Jev was told / not told:</b> every fact from the source. Dropped ones are grouped by reason, so you can check that nothing important was filtered out.</li>
      <li>Use the arrow keys to move between decisions. Run <code>jevbrief ask ... --view</code> to open this page after each run.</li>
    </ol></details>
    ${storyHtml}
    <div class="top-grid ${pg || isTimeline ? "" : "one"}">
      ${pg ? `<div class="card"><div class="bar">What Jev saw &#9642; ${esc(where(r))}</div>${shotHtml}</div>` : timelineHtml}
      <div>
        <div class="card"><div class="bar">${esc((r.ts || "").replace("T", " ").replace("Z", " UTC"))} &#9642; decision ${r.tick}</div><div class="hero">
          <div class="ring" style="background:${soft(t)};color:${color(t)}">${fmt(j.confidence)}</div>
          <div style="min-width:0"><div class="label">Jev picked</div>
          <div class="choice">${esc(j.choice ? labelOf(r, j.choice) : "No answer")}</div>
          <div class="why">Goal: ${esc(r.goal)}</div>
          <div class="badges">${badges}</div></div></div>
          ${j.error ? `<div class="err" style="margin-top:10px">${esc(j.error)}</div>` : ""}</div>
        <div class="card stats">
          <div class="stat"><div class="n">${r.source?.raw_facts ?? r.facts.length}</div><div class="k">facts found</div></div>
          <div class="stat"><div class="n">${kept.length}</div><div class="k">sent to Jev</div></div>
          <div class="stat"><div class="n">${dropped.length}</div><div class="k">dropped, each with a reason</div></div>
          <div class="stat"><div class="n">${r.budget?.used_tokens ?? "–"}<span class="why"> / ${r.budget?.limit_tokens ?? "–"}</span></div><div class="k">tokens used / budget</div></div>
          <div class="stat"><div class="n">${j.latency_ms ?? "–"}</div><div class="k">Jev latency, ms</div></div>
        </div>
        <div class="card"><h2>How sure Jev was, per option</h2>${probHtml}</div>
      </div>
    </div>
    <div class="card"><h2>What Jev was told (${kept.length})</h2>
      <table><thead><tr><th>ID</th><th>Kind</th><th>Label</th><th>Score</th><th>Why kept</th></tr></thead><tbody>${keptRows}</tbody></table></div>
    <div class="card"><h2>What Jev was not told (${dropped.length})</h2>${droppedHtml}</div>`;

  $("help").addEventListener("toggle", (e) => {
    if (!e.target.open) { helpSeen = true; try { localStorage.setItem("jevbrief-help-seen", "1"); } catch {} }
  });
  $("t-kept")?.addEventListener("change", (e) => $("shot").classList.toggle("hide-kept", !e.target.checked));
  $("t-dropped")?.addEventListener("change", (e) => { showDropped = e.target.checked; $("shot").classList.toggle("hide-dropped", !showDropped); });
  $("tl-dropped")?.addEventListener("change", (e) => { showDropped = e.target.checked; $("tl").classList.toggle("hide-dropped", !showDropped); });
  $("replay").addEventListener("click", play);
  $("skip").addEventListener("click", () => play(true));
  play(matchMedia("(prefers-reduced-motion: reduce)").matches);
}

let timers = [];
function play(instant = false) {
  timers.forEach(clearTimeout);
  timers = [];
  const story = $("story"), steps = [...story.querySelectorAll(".steps li")];
  const shot = $("shot"), bars = [...document.querySelectorAll(".prob .fill")];
  const setStep = (n) => {
    story.className = "card story " + Array.from({ length: n }, (_, k) => `s${k + 1}`).join(" ");
    steps.forEach((li, k) => li.classList.toggle("on", k < n));
    if (shot) {
      shot.classList.toggle("hide-kept", n < 3);
      shot.querySelectorAll(".bx.chosen").forEach((b) => (b.style.opacity = n >= 4 ? 1 : 0));
    }
    bars.forEach((b) => (b.style.width = n >= 4 ? b.dataset.w : "0"));
    const tl = $("tl");
    if (tl) tl.className = "card tl " + (showDropped ? "" : "hide-dropped ") + Array.from({ length: n }, (_, k) => `s${k + 1}`).join(" ");
  };
  if (instant) return setStep(4);
  setStep(0);
  [80, 1500, 3000, 4300].forEach((ms, k) => timers.push(setTimeout(() => setStep(k + 1), ms)));
}


function highlight(id, on) {
  document.querySelectorAll(`[data-id="${CSS.escape(id)}"]`).forEach((el) => el.classList.toggle("hl", on));
}
$("detail").addEventListener("mouseover", (e) => { const el = e.target.closest("[data-id]"); if (el) highlight(el.dataset.id, true); });
$("detail").addEventListener("mouseout", (e) => { const el = e.target.closest("[data-id]"); if (el) highlight(el.dataset.id, false); });

function select(i) { selected = i; renderList(); renderDetail(); }
$("list").addEventListener("click", (e) => { const el = e.target.closest(".item"); if (el) select(+el.dataset.i); });
document.addEventListener("keydown", (e) => {
  if (e.target === $("q") || !["ArrowDown", "ArrowUp", "j", "k"].includes(e.key)) return;
  const pos = visible.indexOf(selected), step = e.key === "ArrowDown" || e.key === "j" ? 1 : -1;
  const next = visible[Math.min(visible.length - 1, Math.max(0, pos + step))];
  if (next != null) { e.preventDefault(); select(next); document.querySelector(".item.sel")?.scrollIntoView({ block: "nearest" }); }
});
$("q").addEventListener("input", (e) => {
  const q = e.target.value.toLowerCase();
  visible = records.map((_, i) => i).filter((i) => { const r = records[i]; return !q || `${r.goal} ${r.source?.url} ${r.outcome}`.toLowerCase().includes(q); });
  if (visible.length && !visible.includes(selected)) selected = visible[0];
  renderList(); renderDetail();
});
const runs = new Set(records.map((r) => r.run_id)).size;
$("meta").textContent = `${records.length} decision${records.length === 1 ? "" : "s"} · ${runs} run${runs === 1 ? "" : "s"}`;
select(0);
</script>
</body>
</html>
