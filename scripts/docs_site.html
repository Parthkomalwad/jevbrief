<title>jevbrief docs</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff; --panel: #f1f1f1; --text: #111111; --muted: #555555; --line: #111111; --soft-line: #cfcfcf;
  --bar-bg: #1b1b1b; --bar-text: #f2f2f2;
  --accent: #ff3fd2; --accent-ink: #b0128f; --accent-soft: #ffe0f7; --sky: #d7ecff;
  --code-bg: #f6f6f8;
  --mono: "Cascadia Mono", "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e0e10; --panel: #18181b; --text: #ececec; --muted: #9a9aa0; --line: #3a3a40; --soft-line: #2c2c31;
    --bar-bg: #000000; --bar-text: #f2f2f2;
    --accent: #ff5fdc; --accent-ink: #ff8ae6; --accent-soft: #3a1633; --sky: #13233a; --code-bg: #141417;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e0e10; --panel: #18181b; --text: #ececec; --muted: #9a9aa0; --line: #3a3a40; --soft-line: #2c2c31;
  --bar-bg: #000000; --bar-text: #f2f2f2;
  --accent: #ff5fdc; --accent-ink: #ff8ae6; --accent-soft: #3a1633; --sky: #13233a; --code-bg: #141417;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 var(--mono); }
a { color: var(--accent-ink); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header: the viewer's pink-and-sky bar with its dot texture */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap; padding: 12px 16px; overflow: hidden; border-bottom: 2px solid var(--line);
  background:
    radial-gradient(ellipse 40% 140% at 0% 0%, var(--accent) 0%, transparent 70%),
    radial-gradient(ellipse 35% 140% at 100% 0%, var(--accent) 0%, transparent 70%),
    linear-gradient(var(--sky), var(--sky)); }
header.top::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35;
  background-image: radial-gradient(rgba(255,255,255,.9) 1px, transparent 1.2px); background-size: 4px 4px; }
header.top > * { position: relative; z-index: 1; }
.brand { font: 600 15px var(--sans); background: #fff; color: #111; padding: 4px 8px; text-decoration: none; }
.chip { background: var(--bar-bg); color: var(--bar-text); font-size: 12px; padding: 4px 8px; }
header.top a.chip { text-decoration: none; }
#search { margin-left: auto; width: 280px; max-width: 100%; padding: 6px 10px; border: 2px solid #111; border-radius: 0;
  background: #fff; color: #111; font: 13px var(--mono); }
@media (max-width: 640px) { #search { margin-left: 0; width: 100%; } }

.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 60px); }
.app > * { min-width: 0; }
.card { min-width: 0; }
.doc { overflow-wrap: break-word; }
.doc :not(pre) > code { overflow-wrap: anywhere; }

/* nav: the viewer's decision list */
nav { border-right: 2px solid var(--line); background: var(--bg); padding-bottom: 24px; }
nav .sec { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 16px 14px 6px 22px; }
nav a.item { display: grid; grid-template-columns: 8px 1fr; gap: 12px; padding: 8px 14px 8px 0; border-bottom: 1px solid var(--soft-line);
  color: var(--text); text-decoration: none; }
nav a.item::before { content: ""; background: transparent; }
nav a.item:hover { background: var(--panel); }
nav a.item.sel { background: var(--bar-bg); color: var(--bar-text); }
nav a.item.sel::before { background: var(--accent); }
nav a.item .name { font-weight: 600; }
nav a.item .sub { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; }
nav a.item.sel .sub { color: #bdbdbd; }
nav a.item .hits { float: right; font-size: 11px; background: var(--accent); color: #111; padding: 0 6px; }
nav a.item.miss { opacity: .35; }

/* content */
main { padding: 24px 28px 64px; background: linear-gradient(180deg, var(--sky) 0, var(--bg) 240px); min-width: 0; }
.card { max-width: 900px; background: var(--bg); border: 2px solid var(--line); outline: 1px solid var(--line); outline-offset: 2px;
  margin: 3px 3px 24px; }
.card > .bar { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 5px 10px;
  background: var(--bar-bg); color: var(--bar-text); font-size: 12px; letter-spacing: .3px; }
.card > .bar a { color: var(--bar-text); }
.doc { padding: 6px 22px 22px; }
.doc > :first-child { margin-top: 12px; }
.doc h1 { font: 700 26px/1.2 var(--sans); margin: 18px 0 10px; text-wrap: balance; }
.doc h2 { font: 13px var(--mono); letter-spacing: .3px; margin: 30px -22px 14px; padding: 5px 22px;
  background: var(--bar-bg); color: var(--bar-text); }
.doc h3 { font: 600 16px var(--sans); margin: 22px 0 8px; }
.doc p, .doc li { max-width: 72ch; }
.doc ul, .doc ol { padding-left: 22px; }
.doc li { margin: 4px 0; }
.doc li::marker { color: var(--accent-ink); }
.doc strong { font-weight: 700; }
.doc img { display: block; max-width: 100%; height: auto; border: 2px solid var(--line); margin: 12px 0; background: #fff; }
.doc code { font: 13px var(--mono); background: var(--accent-soft); padding: 0 4px; }
.doc a code { background: transparent; padding: 0; }
.doc pre { position: relative; background: var(--code-bg); border: 1px solid var(--line); padding: 12px 14px; overflow-x: auto; }
.doc pre code { background: transparent; padding: 0; font-size: 12.5px; line-height: 1.55; }
.doc pre button.copy { position: absolute; top: 6px; right: 6px; font: 11px var(--mono); padding: 2px 8px; cursor: pointer;
  background: var(--bar-bg); color: var(--bar-text); border: 0; border-radius: 0; opacity: .8; }
.doc pre button.copy:hover { opacity: 1; }
.table { overflow-x: auto; margin: 12px 0; }
.doc table { border-collapse: collapse; width: 100%; font-size: 13px; }
.doc th, .doc td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--soft-line); vertical-align: top; }
.doc th { font-size: 11px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .5px;
  border-bottom: 2px solid var(--line); }
.doc td { font-variant-numeric: tabular-nums; }
/* the "at a glance" table: a two-column table with an empty header */
.doc table.glance { background: var(--panel); border: 2px solid var(--line); }
.doc table.glance thead { display: none; }
.doc table.glance td:first-child { width: 150px; white-space: nowrap; }
.doc table.glance td:first-child strong { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
mark { background: var(--accent); color: #111; }

/* overview header: the pipeline animation from the README */
.hero { max-width: 900px; margin: 3px 3px 24px; display: grid; gap: 14px; }
.hero h1 { font: 700 30px/1.15 var(--sans); margin: 4px 0 0; text-wrap: balance; }
.hero p { margin: 0; max-width: 70ch; }
.hero img { width: 100%; max-width: 100%; border: 2px solid var(--line); background: #fff; }
.install { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.install code { font: 13px var(--mono); background: var(--bar-bg); color: var(--bar-text); padding: 6px 10px; }
.install button { font: 12px var(--mono); padding: 6px 10px; border: 2px solid var(--line); background: var(--bg); color: var(--text);
  cursor: pointer; border-radius: 0; }
.pager { max-width: 900px; display: flex; justify-content: space-between; gap: 12px; margin: 0 3px; }
.pager a { flex: 1 1 0; border: 2px solid var(--line); padding: 8px 12px; text-decoration: none; color: var(--text); background: var(--bg); }
.pager a:hover { background: var(--panel); }
.pager a .k { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.pager a.next { text-align: right; }
.results { max-width: 900px; margin: 3px 3px 24px; }
.results .hit { display: block; border: 2px solid var(--line); background: var(--bg); padding: 10px 14px; margin-bottom: 10px;
  color: var(--text); text-decoration: none; }
.results .hit:hover { background: var(--panel); }
.results .hit .where { font-size: 12px; color: var(--muted); }

@media (max-width: 800px) {
  .app { grid-template-columns: 1fr; }
  nav { border-right: 0; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 16px; }
  nav .sec { display: none; }
  nav a.item { display: inline-block; border: 1px solid var(--line); padding: 3px 8px; }
  nav a.item::before, nav a.item .sub { display: none; }
  main { padding: 16px 16px 48px; }
  .doc { padding: 4px 14px 16px; }
  .doc h2 { margin-left: -14px; margin-right: -14px; padding-left: 14px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<header class="top">
  <a class="brand" href="#home">jevbrief <span style="color:#b0128f">docs</span></a>
  <span class="chip" id="version"></span>
  <a class="chip" id="repo" href="https://github.com/parthkomalwad/jevbrief">GitHub</a>
  <a class="chip" href="https://pypi.org/project/jevbrief">PyPI</a>
  <input id="search" type="search" placeholder="Search the docs, e.g. read_only" aria-label="Search the docs">
</header>
<div class="app">
  <nav id="nav" aria-label="Pages"></nav>
  <main id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DOCS = __DOCS__;
const pages = DOCS.pages;
const byRoute = Object.fromEntries(pages.map(p => [p.route, p]));
const nav = document.getElementById("nav"), main = document.getElementById("main"), search = document.getElementById("search");
document.getElementById("version").textContent = "v" + DOCS.version;

const slug = t => t.trim().toLowerCase().replace(/[^\w\- ]/g, "").replace(/ /g, "-");
const esc = s => s.replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function buildNav(hits) {
  let html = "", section = "";
  for (const p of pages) {
    if (p.section !== section) { section = p.section; html += `<div class="sec">${esc(section)}</div>`; }
    const n = hits ? (hits[p.route] || 0) : null;
    const cls = ["item", hits && !n ? "miss" : ""].join(" ");
    html += `<a class="${cls}" href="#${p.route}" data-route="${p.route}"><span><span class="name">${esc(p.label)}</span>` +
            (n ? `<span class="hits">${n}</span>` : "") + `<span class="sub">${esc(p.summary)}</span></span></a>`;
  }
  nav.innerHTML = html;
}

function copyButton(pre, text) {
  const b = document.createElement("button");
  b.className = "copy"; b.type = "button"; b.textContent = "copy";
  b.addEventListener("click", () => {
    const done = () => { b.textContent = "copied"; setTimeout(() => (b.textContent = "copy"), 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => select(pre)); else select(pre);
  });
  pre.appendChild(b);
}
function select(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

function hero() {
  return `<section class="hero">
    <h1>Clean, traceable state briefings for TypeSafe's Jev, from any source.</h1>
    <p>Other tools show what Jev decided. jevbrief shows what Jev was told, what it wasn't told, and why.</p>
    <div class="install"><code id="pip">pip install jevbrief</code><button type="button" id="pipcopy">copy</button></div>
    <img src="assets/pipeline.svg" alt="Facts from a source flow into the rules, noise is dropped with a reason code, the rest goes to Jev, and Jev picks one">
  </section>`;
}

function render(route, anchor) {
  const p = byRoute[route] || byRoute.home;
  const i = pages.indexOf(p), prev = pages[i - 1], next = pages[i + 1];
  const body = marked.parse(p.md, {gfm: true});
  main.innerHTML = (p.route === "home" ? hero() : "") +
    `<article class="card"><div class="bar"><span>${esc(p.src)}</span>` +
    `<a href="${DOCS.repo}/blob/main/${p.src}">View source</a></div><div class="doc">${body}</div></article>` +
    `<div class="pager">${prev ? `<a href="#${prev.route}"><span class="k">Previous</span>${esc(prev.label)}</a>` : "<span></span>"}` +
    `${next ? `<a class="next" href="#${next.route}"><span class="k">Next</span>${esc(next.label)}</a>` : ""}</div>`;
  const doc = main.querySelector(".doc");
  doc.querySelectorAll("h1,h2,h3,h4").forEach(h => (h.id = p.route + "." + slug(h.textContent)));
  doc.querySelectorAll("table").forEach(t => {
    const wrap = document.createElement("div"); wrap.className = "table"; t.replaceWith(wrap); wrap.appendChild(t);
    const heads = [...t.querySelectorAll("thead th")];
    if (heads.length === 2 && heads.every(th => !th.textContent.trim())) t.classList.add("glance");
  });
  doc.querySelectorAll("pre").forEach(pre => copyButton(pre, pre.textContent));
  doc.querySelectorAll('a[href^="http"]').forEach(a => { a.target = "_blank"; a.rel = "noopener"; });
  const pip = document.getElementById("pipcopy");
  if (pip) pip.addEventListener("click", () => {
    const done = () => { pip.textContent = "copied"; setTimeout(() => (pip.textContent = "copy"), 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText("pip install jevbrief").then(done, () => select(document.getElementById("pip")));
  });
  nav.querySelectorAll("a.item").forEach(a => a.classList.toggle("sel", a.dataset.route === p.route));
  document.title = (p.route === "home" ? "" : p.label + " · ") + "jevbrief docs";
  const target = anchor && document.getElementById(p.route + "." + anchor);
  if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
}

function route() {
  const h = location.hash.slice(1);
  const dot = h.indexOf(".");
  const r = dot < 0 ? h : h.slice(0, dot), anchor = dot < 0 ? "" : h.slice(dot + 1);
  if (search.value.trim()) { search.value = ""; buildNav(); }
  render(byRoute[r] ? r : "home", anchor);
}

/* search: count matches per page, list the matching sections */
function runSearch() {
  const q = search.value.trim().toLowerCase();
  if (!q) { buildNav(); route(); return; }
  const hits = {}, results = [];
  for (const p of pages) {
    let section = p.label;
    for (const line of p.md.split("\n")) {
      const h = line.match(/^#{1,3} (.+)/);
      if (h) section = h[1];
      if (line.toLowerCase().includes(q)) {
        hits[p.route] = (hits[p.route] || 0) + 1;
        if (results.length < 40) results.push({p, section, line: line.replace(/[#*`|>]/g, " ").trim()});
      }
    }
  }
  buildNav(hits);
  const mark = s => esc(s).replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => `<mark>${m}</mark>`);
  main.innerHTML = `<div class="results"><article class="card"><div class="bar"><span>search: ${esc(q)}</span>` +
    `<span>${results.length} matches</span></div></article>` +
    (results.length ? results.map(r => `<a class="hit" href="#${r.p.route}.${slug(r.section)}">` +
      `<span class="where">${esc(r.p.label)} › ${esc(r.section)}</span><br>${mark(r.line.slice(0, 220))}</a>`).join("")
      : `<p>No page mentions “${esc(q)}”. Try a shorter word.</p>`) + `</div>`;
}

buildNav();
search.addEventListener("input", runSearch);
window.addEventListener("hashchange", route);
route();
</script>
