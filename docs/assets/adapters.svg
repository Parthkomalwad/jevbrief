<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Consolas, 'Cascadia Mono', ui-monospace, monospace">
  <title>jevbrief adapters: web pages, JSON data, OpenTelemetry logs, and NES games are supported; Slack and Discord are coming; you can suggest or build your own.</title>
  <style>
    .bg { fill: #ffffff; }
    .card { fill: #dedede; stroke: #111; stroke-width: 2; }
    .soon { fill: #f1f1f1; stroke: #999; stroke-width: 2; stroke-dasharray: 6 5; }
    .bar { fill: #1b1b1b; }
    .bartxt { fill: #f2f2f2; font-size: 14px; font-weight: 700; }
    .tag { font-size: 11px; font-weight: 700; }
    .ok { fill: #0f7a3d; }
    .next { fill: #9a6200; }
    .t { fill: #111; font-size: 13px; }
    .m { fill: #555; font-size: 12px; }
    .big { fill: #111; font-size: 22px; font-weight: 700; }
    .pick { fill: #ff3fd2; font-size: 13px; font-weight: 700; }
    .track { fill: #fff; stroke: #111; stroke-width: 1; }
    .fill { fill: #ff3fd2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0e0e10; }
      .card { fill: #1c1c1f; stroke: #4a4a52; }
      .soon { fill: #141416; stroke: #4a4a52; }
      .bar { fill: #000; }
      .t, .big { fill: #ececec; }
      .m { fill: #9a9aa0; }
      .ok { fill: #5fd18e; }
      .next { fill: #f0b64a; }
      .track { fill: #2a2a30; stroke: #6a6a74; }
      .pick { fill: #ff5fdc; }
    }
    .grow { transform-box: fill-box; transform-origin: left; animation: grow 6s infinite ease-out; }
    .g2 { animation-delay: .4s; } .g3 { animation-delay: .8s; }
    .fade { animation: fade 6s infinite; } .f2 { animation-delay: .4s; } .f3 { animation-delay: .8s; }
    @keyframes grow { 0% { transform: scaleX(1); } 8% { transform: scaleX(1); } 30%, 85% { transform: scaleX(.08); } 100% { transform: scaleX(1); } }
    @keyframes fade { 0%, 30% { opacity: 0; } 40%, 88% { opacity: 1; } 100% { opacity: 0; } }
  </style>
  <rect class="bg" width="960" height="400"/>

  <!-- supported -->
  <g transform="translate(16,16)">
    <rect class="card" width="296" height="176"/><rect class="bar" width="296" height="30"/>
    <text class="bartxt" x="12" y="20">WEB PAGES</text><text class="tag ok" x="226" y="20">SUPPORTED</text>
    <text class="m" x="14" y="54">jevbrief[web] · Playwright</text>
    <text class="big" x="14" y="88">96 → 28</text><text class="m" x="132" y="88">elements sent</text>
    <rect class="track" x="14" y="100" width="268" height="10"/><rect class="fill grow" x="14" y="100" width="268" height="10"/>
    <text class="t fade" x="14" y="136">Jev: click "Add to cart"</text>
    <text class="pick fade" x="14" y="160">confidence 0.99 · −57% tokens</text>
  </g>
  <g transform="translate(332,16)">
    <rect class="card" width="296" height="176"/><rect class="bar" width="296" height="30"/>
    <text class="bartxt" x="12" y="20">JSON DATA</text><text class="tag ok" x="226" y="20">SUPPORTED</text>
    <text class="m" x="14" y="54">jevbrief · any data + a config file</text>
    <text class="big" x="14" y="88">36 → 17</text><text class="m" x="132" y="88">tickets sent</text>
    <rect class="track" x="14" y="100" width="268" height="10"/><rect class="fill grow g2" x="14" y="100" width="268" height="10"/>
    <text class="t fade f2" x="14" y="136">Jev: open "Charged two times"</text>
    <text class="pick fade f2" x="14" y="160">confidence 1.00 · −48% tokens</text>
  </g>
  <g transform="translate(648,16)">
    <rect class="card" width="296" height="176"/><rect class="bar" width="296" height="30"/>
    <text class="bartxt" x="12" y="20">OPENTELEMETRY LOGS</text><text class="tag ok" x="226" y="20">SUPPORTED</text>
    <text class="m" x="14" y="54">jevbrief · OTLP JSON exports</text>
    <text class="big" x="14" y="88">1,395 → 5</text><text class="m" x="152" y="88">groups sent</text>
    <rect class="track" x="14" y="100" width="268" height="10"/><rect class="fill grow g3" x="14" y="100" width="268" height="10"/>
    <text class="t fade f3" x="14" y="136">Jev: cause "config reload failed"</text>
    <text class="pick fade f3" x="14" y="160">confidence 0.99 · −96% tokens</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(16,208)">
    <rect class="card" width="296" height="176"/><rect class="bar" width="296" height="30"/>
    <text class="bartxt" x="12" y="20">NES GAMES</text><text class="tag ok" x="226" y="20">SUPPORTED</text>
    <text class="m" x="14" y="54">jevbrief[nes] · Nova the Squirrel</text>
    <text class="big" x="14" y="88">2,829 → 713</text><text class="m" x="190" y="88">tokens sent</text>
    <rect class="track" x="14" y="100" width="268" height="10"/><rect class="fill grow" x="14" y="100" width="268" height="10"/>
    <text class="t fade" x="14" y="136">"Wall ahead, low, touching"</text>
    <text class="pick fade" x="14" y="160">Jev: short_hop · live viewer</text>
  </g>
  <g transform="translate(332,208)">
    <rect class="soon" width="296" height="176"/>
    <text class="t" x="14" y="28" font-weight="700">SLACK &amp; DISCORD</text><text class="tag next" x="232" y="28">v0.4</text>
    <text class="m" x="14" y="56">Export files · jevbrief[chat]</text>
    <text class="t" x="14" y="92">Threads → messages that matter</text>
    <text class="t" x="14" y="116">Jev: this message answers it</text>
    <text class="m" x="14" y="156">Authors pseudonymized by default</text>
  </g>
  <g transform="translate(648,208)">
    <rect class="soon" width="296" height="176"/>
    <text class="t" x="14" y="28" font-weight="700">YOUR SOURCE</text><text class="pick" x="232" y="28" font-size="11">OPEN</text>
    <text class="m" x="14" y="56">CSV · RSS · Android · Kubernetes</text>
    <text class="m" x="14" y="76">terminal · pull requests · email</text>
    <text class="t" x="14" y="116">Suggest it, or build it with</text>
    <text class="t" x="14" y="138">the adapter template</text>
    <text class="m" x="14" y="162">ADAPTERS.md</text>
  </g>
</svg>
